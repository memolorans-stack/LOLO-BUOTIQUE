
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إدارة LOLO BOUTIQUE</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #faf5f1;
      color: #49342f;
    }
    header {
      background: #c89e8d;
      color: white;
      text-align: center;
      padding: 24px;
    }
    main {
      max-width: 650px;
      margin: auto;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      margin: 15px 0;
      border-radius: 15px;
      box-shadow: 0 3px 12px #00000010;
    }
    button {
      background: #a76e79;
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 12px;
      width: 100%;
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <header>
    <h1>LOLO BOUTIQUE</h1>
    <p>لوحة إدارة المتجر</p>
  </header>

  <main>
  
<div class="card" id="productsPanel" style="display:none">
  <h2>إضافة منتج جديد</h2>

  <input id="productName" type="text"
    placeholder="اسم المنتج">

  <input id="productPrice" type="number"
    placeholder="السعر بالدينار العراقي">

  <input id="productStock" type="number"
    placeholder="الكمية بالمخزن">

  <textarea id="productDescription"
    placeholder="وصف المنتج"></textarea>

  <p>صورة المنتج:</p>
  <input id="productImage" type="file"
    accept="image/*">

  <button type="button" id="addProductBtn">
    إضافة المنتج
  </button>

  <p id="productMessage"></p>
</div>


    <div class="card">
      <h2>الطلبات</h2>
      <p>متابعة الطلبات وتجهيزها</p>
      <button disabled>قريباً</button>
    </div>

    <div class="card">
      <h2>مظهر المتجر</h2>
      <p>تغيير الشعار والألوان والعنوان</p>
      <button disabled>قريباً</button>
    </div>

    <div class="card">
      <h2>إدارة الموظفين</h2>
      <p>إضافة المسؤول والموظف وتحديد صلاحياتهم</p>
      <button disabled>قريباً</button>
    </div>
  </main>
  
<div id="loginBox" class="card">
  <h2>تسجيل دخول الإدارة</h2>
  <input id="adminEmail" type="email"
    placeholder="البريد الإلكتروني">
  <input id="adminPassword" type="password"
    placeholder="كلمة المرور">
  <button type="button" id="loginBtn">
    تسجيل الدخول
  </button>
  <p id="loginMessage"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://yeihtioiuwxfhxbrfgbl.supabase.co";
  const SUPABASE_KEY = "sb_publishable_hDsENPJ7yzc9vzPRPizGnA_FyGjjG1c";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
  
document.getElementById("loginBtn").addEventListener("click", async () => {
  const email = document.getElementById("adminEmail").value.trim();
  const password = document.getElementById("adminPassword").value;
  const message = document.getElementById("loginMessage");
  const button = document.getElementById("loginBtn");

  if (!email || !password) {
    message.textContent = "أدخل البريد الإلكتروني وكلمة المرور";
    return;
  }

  button.disabled = true;
  message.textContent = "جاري تسجيل الدخول...";

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;
if (data.user.id !== "16579f8a-aea5-408a-8571-1a7bbc55916f") {
  throw new Error("غير مصرح لهذا الحساب");
}
    message.textContent = "تم تسجيل الدخول بنجاح";
    document.getElementById("productsPanel").style.display = "block";
  } catch (error) {
    message.textContent = "تعذر تسجيل الدخول. تأكد من بيانات الحساب.";
  } finally {
    button.disabled = false;
  }
});

document.getElementById("addProductBtn").addEventListener("click", async () => {
  const message = document.getElementById("productMessage");
  const button = document.getElementById("addProductBtn");
  const name = document.getElementById("productName").value.trim();
  const price = Number(document.getElementById("productPrice").value);
  const stockText = document.getElementById("productStock").value;
  const description = document.getElementById("productDescription").value.trim();
  const file = document.getElementById("productImage").files[0];

  if (!name || !Number.isInteger(price) || price <= 0) {
    message.textContent = "أدخل اسم المنتج وسعر صحيح";
    return;
  }

  const stock = stockText === "" ? null : Number(stockText);
  if (stock !== null && (!Number.isInteger(stock) || stock < 0)) {
    message.textContent = "أدخل كمية صحيحة";
    return;
  }

  button.disabled = true;
  message.textContent = "جاري حفظ المنتج...";

  try {
    const { data: { user }, error: authError } =
      await supabaseClient.auth.getUser();

    if (authError || !user ||
        user.id !== "16579f8a-aea5-408a-8571-1a7bbc55916f") {
      throw new Error("سجّل دخول المدير أولاً");
    }

    let imageUrl = null;

    if (file) {
      if (!file.type.startsWith("image/") || file.size > 5 * 1024 * 1024) {
        throw new Error("اختار صورة أقل من 5 ميغابايت");
      }

      const extension = file.name.split(".").pop().toLowerCase();
      const path = `${user.id}/${crypto.randomUUID()}.${extension}`;

      const { error: uploadError } = await supabaseClient.storage
        .from("product-images")
        .upload(path, file, { contentType: file.type });

      if (uploadError) throw uploadError;

      const { data } = supabaseClient.storage
        .from("product-images")
        .getPublicUrl(path);

      imageUrl = data.publicUrl;
    }

    const { error } = await supabaseClient
      .from("Products")
      .insert({
        
Neme: name,
Price: price,
Stock: stock,
Image_url: imageUrl,
Is_active: true

      });

    if (error) throw error;

    message.textContent = "تمت إضافة المنتج بنجاح ✅";
    document.getElementById("productName").value = "";
    document.getElementById("productPrice").value = "";
    document.getElementById("productStock").value = "";
    document.getElementById("productDescription").value = "";
    document.getElementById("productImage").value = "";

  } catch (error) {
    message.textContent = "تعذر الحفظ: " + error.message;
  } finally {
    button.disabled = false;
  }
});

</script>

</body>
</html>
