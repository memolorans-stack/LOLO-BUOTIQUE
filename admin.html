<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة LOLO BOUTIQUE</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#faf5f1;color:#49342f}
header{background:#a76e79;color:white;text-align:center;padding:25px}
main{max-width:800px;margin:auto;padding:15px}
.card{background:white;padding:20px;margin:15px 0;border-radius:15px;box-shadow:0 3px 12px #00000010}
input,textarea,select{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:9px;font-size:16px}
button{background:#a76e79;color:white;border:0;border-radius:9px;padding:12px;margin:5px 0;width:100%;font-size:16px;cursor:pointer}
button:disabled{opacity:.5}
.danger{background:#b83e3e}
.green{background:#39815d}
img{width:100px;height:100px;object-fit:contain;border-radius:10px}
[hidden]{display:none!important}
p{overflow-wrap:anywhere}
h2{color:#a76e79}
</style>
</head>
<body>

<header>
<h1>LOLO BOUTIQUE</h1>
<p>لوحة الإدارة</p>
</header>

<main>

<div class="card" id="loginBox">
<h2>تسجيل دخول الإدارة</h2>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">
<button id="loginBtn">تسجيل الدخول</button>
<p id="loginMessage"></p>
</div>

<div id="dashboard" hidden>

<div class="card">
<h2>مرحباً بك في لوحة الإدارة</h2>
<button onclick="showPanel('products')">إدارة المنتجات</button>
<button onclick="showPanel('orders')">إدارة الطلبات</button>
<button disabled>مظهر المتجر - قريباً</button>
<button disabled>إدارة الموظفين - قريباً</button>
<button class="danger" id="logoutBtn">تسجيل الخروج</button>
</div>

<div id="productsPanel">

<div class="card">
<h2 id="formTitle">إضافة منتج جديد</h2>

<input id="productName" placeholder="اسم المنتج">
<input id="productPrice" type="number" min="1" placeholder="السعر بالدينار">
<input id="productStock" type="number" min="0" placeholder="الكمية بالمخزن">
<textarea id="productDescription" placeholder="وصف المنتج"></textarea>

<label>صورة المنتج</label>
<input id="productImage" type="file" accept="image/*">

<label>حالة المنتج</label>
<select id="productActive">
<option value="true">ظاهر للزبائن</option>
<option value="false">مخفي</option>
</select>

<button id="saveBtn" class="green">حفظ المنتج</button>
<button onclick="resetForm()">إلغاء التعديل / منتج جديد</button>

<p id="productMessage"></p>
</div>

<div class="card">
<h2>المنتجات الموجودة</h2>
<input id="search" placeholder="ابحث عن منتج">
<button onclick="loadProducts()">تحديث المنتجات</button>
<div id="productList"></div>
</div>

</div>

<div id="ordersPanel" hidden>
<div class="card">
<h2>طلبات الزبائن</h2>

<input id="orderSearch"
placeholder="ابحث برقم الطلب أو الهاتف أو اسم الزبون"
oninput="renderOrders()">

<select id="orderFilter" onchange="renderOrders()">
<option value="all">جميع الطلبات</option>
<option value="جديد">الطلبات الجديدة</option>
<option value="قيد التجهيز">قيد التجهيز</option>
<option value="تم التجهيز">تم التجهيز</option>
<option value="خرج للتوصيل">خرج للتوصيل</option>
<option value="تم التسليم">تم التسليم</option>
<option value="ملغي">الطلبات الملغاة</option>
</select>

<p id="orderCount"></p>
<button onclick="loadOrders()">تحديث الطلبات</button>
<div id="orderList"></div>
</div>
</div>

</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const db = window.supabase.createClient(
"https://yeihtioiuwxfhxbrfgbl.supabase.co",
"sb_publishable_hDsENPJ7yzc9vzPRPizGnA_FyGjjG1c"
);

const $ = id => document.getElementById(id);

let editingId = null;
let oldImage = null;
let products = [];

async function checkAdmin(){

const {data:{user},error} = await db.auth.getUser();

if(error || !user) return false;

const {data:role,error:roleError} = await db
.from("staff_roles")
.select("role")
.eq("user_id",user.id)
.maybeSingle();

return !roleError && role?.role === "admin";

}

async function openDashboard(){

if(!await checkAdmin()){
$("dashboard").hidden=true;
$("loginBox").hidden=false;
return false;
}

$("loginBox").hidden=true;
$("dashboard").hidden=false;

await loadProducts();

return true;
}

$("loginBtn").onclick=async()=>{

try{

$("loginBtn").disabled=true;
$("loginMessage").textContent="جاري تسجيل الدخول...";

const {error}=await db.auth.signInWithPassword({
email:$("email").value.trim(),
password:$("password").value
});

if(error) throw error;

if(!await openDashboard()){
await db.auth.signOut();
throw new Error("هذا الحساب غير مصرح له");
}

$("password").value="";
$("loginMessage").textContent="";

}catch(error){

$("loginMessage").textContent=error.message;

}finally{

$("loginBtn").disabled=false;

}

};

$("logoutBtn").onclick=async()=>{

const {error}=await db.auth.signOut();

if(error){
alert(error.message);
return;
}

products=[];
$("productList").replaceChildren();
$("orderList").replaceChildren();
resetForm();
$("dashboard").hidden=true;
$("loginBox").hidden=false;

};

function showPanel(panel){

$("productsPanel").hidden=panel!=="products";
$("ordersPanel").hidden=panel!=="orders";

if(panel==="orders") loadOrders();

}

function resetForm(){

editingId=null;
oldImage=null;

$("productName").value="";
$("productPrice").value="";
$("productStock").value="";
$("productDescription").value="";
$("productImage").value="";
$("productActive").value="true";
$("formTitle").textContent="إضافة منتج جديد";
$("productMessage").textContent="";

}

$("saveBtn").onclick=async()=>{

let uploadedPath=null;
let saved=false;

try{

$("saveBtn").disabled=true;
$("productMessage").textContent="جاري الحفظ...";

if(!await checkAdmin())
throw new Error("سجل دخول المدير أولاً");

const name=$("productName").value.trim();
const price=Number($("productPrice").value);
const stock=Number($("productStock").value);
const file=$("productImage").files[0];

if(!name || !Number.isSafeInteger(price) || price<=0)
throw new Error("أدخل اسم المنتج والسعر الصحيح");

if($("productStock").value==="" || !Number.isInteger(stock) || stock<0)
throw new Error("أدخل كمية صحيحة");

let imageUrl=oldImage;

if(file){

if(!["image/jpeg","image/png","image/webp"].includes(file.type) || file.size>5*1024*1024)
throw new Error("اختر صورة JPG أو PNG أو WEBP أقل من 5 ميغابايت");

const {data:{user}}=await db.auth.getUser();

const ext={"image/jpeg":"jpg","image/png":"png","image/webp":"webp"}[file.type];

const path=user.id+"/"+crypto.randomUUID()+"."+ext;

const {error}=await db.storage
.from("product-images")
.upload(path,file,{contentType:file.type});

if(error) throw error;

uploadedPath=path;

imageUrl=db.storage
.from("product-images")
.getPublicUrl(path).data.publicUrl;

}

const product={
Neme:name,
Price:price,
Stock:stock,
Description:$("productDescription").value.trim(),
Image_url:imageUrl,
Is_active:$("productActive").value==="true"
};

let result;

if(editingId!==null){

result=await db.from("Products")
.update(product)
.eq("id",editingId)
.select("id")
.single();

}else{

result=await db.from("Products")
.insert(product)
.select("id")
.single();

}

if(result.error) throw result.error;

saved=true;

resetForm();

$("productMessage").textContent="تم حفظ المنتج بنجاح ✅";

await loadProducts();

}catch(error){

if(uploadedPath && !saved){
await db.storage.from("product-images").remove([uploadedPath]);
}

$("productMessage").textContent="تعذر الحفظ: "+error.message;

}finally{

$("saveBtn").disabled=false;

}

};

async function loadProducts(){

const {data,error}=await db
.from("Products")
.select("*")
.order("id",{ascending:false});

if(error){
$("productList").textContent=error.message;
return;
}

products=data||[];
renderProducts();

}

function addText(parent,value){

const p=document.createElement("p");
p.textContent=value;
parent.appendChild(p);

}

function addButton(parent,label,action,style=""){

const b=document.createElement("button");
b.textContent=label;
b.className=style;
b.onclick=action;
parent.appendChild(b);

}

function renderProducts(){

const search=$("search").value.toLowerCase();

$("productList").replaceChildren();

for(const p of products){

if(!String(p.Neme||"").toLowerCase().includes(search)) continue;

const card=document.createElement("div");

card.className="card";

if(p.Image_url){

const image=document.createElement("img");

if(/^https:\/\//i.test(p.Image_url)){
image.src=p.Image_url;
image.alt=p.Neme||"صورة المنتج";
card.appendChild(image);
}

}

addText(card,p.Neme);
addText(card,"السعر: "+p.Price+" د.ع");
addText(card,"المخزون: "+(p.Stock??"غير محدد"));
addText(card,p.Description||"");
addText(card,p.Is_active?"ظاهر للزبائن":"مخفي");

addButton(card,"تعديل المنتج",()=>editProduct(p));

addButton(card,p.Is_active?"إخفاء المنتج":"إظهار المنتج",()=>toggleProduct(p));

addButton(card,"حذف المنتج",()=>deleteProduct(p),"danger");

$("productList").appendChild(card);

}

}

$("search").oninput=renderProducts;

function editProduct(p){

editingId=p.id;
oldImage=p.Image_url;

$("productName").value=p.Neme||"";
$("productPrice").value=p.Price;
$("productStock").value=p.Stock??"";
$("productDescription").value=p.Description||"";
$("productActive").value=String(p.Is_active);
$("productImage").value="";
$("formTitle").textContent="تعديل المنتج";
$("productMessage").textContent="";

$("formTitle").scrollIntoView({behavior:"smooth"});

}

async function toggleProduct(p){

if(!await checkAdmin()) return;

const {error}=await db.from("Products")
.update({Is_active:!p.Is_active})
.eq("id",p.id)
.select("id")
.single();

if(error) alert(error.message);

await loadProducts();

}

async function deleteProduct(p){

if(!confirm("هل تريد حذف هذا المنتج نهائياً؟")) return;

if(!await checkAdmin()) return;

const {error}=await db.from("Products")
.delete()
.eq("id",p.id)
.select("id")
.single();

if(error){
alert(error.message);
return;
}

if(editingId===p.id) resetForm();

await loadProducts();

}

let orderCache = [];

function orderStatus(status){
  return !status || status==="pending"
    ? "جديد" : status;
}

function money(value){
  return Number(value||0).toLocaleString("en-US")+" د.ع";
}

async function loadOrders(){

  orderCache=[];
  $("orderCount").textContent="";
  $("orderList").textContent="جاري تحميل الطلبات...";

  if(!await checkAdmin()){
    $("orderList").textContent="غير مصرح";
    return;
  }

  const {data,error}=await db.from("orders")
    .select("*")
    .order("id",{ascending:false});

  if(error){
    $("orderList").textContent=error.message;
    return;
  }

  orderCache=data||[];
  renderOrders();
}

function renderOrders(){

  if($("dashboard").hidden) return;

  const search=$("orderSearch").value.trim().toLowerCase();
  const filter=$("orderFilter").value;

  const rows=orderCache.filter(o=>{

    const matches=[
      o.id,
      o.customer_name,
      o.customer_phone,
      o.governorate
    ].some(v=>String(v||"").toLowerCase().includes(search));

    return matches &&
      (filter==="all" || orderStatus(o.status)===filter);
  });

  $("orderList").replaceChildren();
  $("orderCount").textContent="عدد الطلبات: "+rows.length;

  if(!rows.length){
    $("orderList").textContent="لا توجد طلبات مطابقة";
    return;
  }

  for(const o of rows){

    const card=document.createElement("div");
    card.className="card";

    const heading=document.createElement("h2");
    heading.textContent="طلب رقم #"+o.id;
    card.appendChild(heading);

    addText(card,"التاريخ: "+new Date(o.created_at).toLocaleString("ar-IQ"));
    addText(card,"الزبون: "+o.customer_name);
    addText(card,"الهاتف: "+o.customer_phone);
    addText(card,"المحافظة: "+(o.governorate==="Baghdad"?"بغداد":o.governorate));
    addText(card,"العنوان: "+o.address);

    addText(card,"━━━━━━━━━━━━");
    addText(card,"المنتجات المطلوبة:");

    try{

      const items=typeof o.items==="string"
        ? JSON.parse(o.items) : o.items;

      if(!Array.isArray(items)) throw new Error();

      for(const item of items){

        const name=item.product||item.name||item.Neme||"منتج";
        const qty=item.quantity??item.qty??1;
        const price=item.unit_price_iqd??item.price??item.Price;

        addText(card,"المنتج: "+name);
        addText(card,"الكمية: "+qty);

        if(price!=null){
          addText(card,"سعر القطعة: "+money(price));
          addText(card,"المجموع: "+money(Number(price)*Number(qty)));
        }
      }

    }catch{

      addText(card,String(o.items||""));

    }

    addText(card,"━━━━━━━━━━━━");
    addText(card,"الإجمالي المسجل: "+money(o.total_price));
    addText(card,"أجور التوصيل: "+money(o.delivery_fee));

    addText(card,"الحالة: "+orderStatus(o.status));

    const select=document.createElement("select");

    const statuses=[...new Set([
      "جديد",
      "قيد التجهيز",
      "تم التجهيز",
      "خرج للتوصيل",
      "تم التسليم",
      "ملغي",
      orderStatus(o.status)
    ])];

    for(const status of statuses){

      const option=document.createElement("option");
      option.value=status;
      option.textContent=status;
      select.appendChild(option);

    }

    select.value=orderStatus(o.status);
    card.appendChild(select);

    addButton(card,"حفظ حالة الطلب",async()=>{

      if(!await checkAdmin()) return;

      const {error}=await db.from("orders")
        .update({status:select.value})
        .eq("id",o.id)
        .select("id")
        .single();

      if(error){
        alert(error.message);
        return;
      }

      alert("تم تحديث حالة الطلب بنجاح");
      await loadOrders();

    },"green");

    $("orderList").appendChild(card);

  }
}

openDashboard();

</script>
</body>
</html>
